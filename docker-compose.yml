      - db

  db:
    image: postgres:13
    environment:
      - DEBUG=True
      - SECRET_KEY = 'django-insecure-ppmt7@!)-6&#(a95ooei+epa2y1amprbty6w@d(k-y!-e&l9(c'
      - POSTGRES_DB=buffet_proevent
      - POSTGRES_USER=mrgomez
      - POSTGRES_PASSWORD=Karin2100
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

