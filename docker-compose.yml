      - .:/app  # Monta todo el proyecto en el contenedor
      - ./dashboard/static:/app/dashboard/static  # Monta específicamente el directorio de arch
    ports:
      - "8002:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY='django-insecure-ppmt7@!)-6&#(a95ooei+epa2y1amprbty6w@d(k-y!-e&l9(c'
      - ALLOWED_HOSTS=localhost,127.0.0.1
